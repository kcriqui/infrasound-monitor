# TrueNAS SCALE custom app: analysis + a local web view of the dashboard.
#
# The Pi keeps only acquisition (infra-acquire, statusd, the TFT) -- all tiny.
# Everything that needs memory happens here. Deploy with the dataset path below
# matching the one you created; see README.md in this directory.
services:
  analysis:
    build:
      context: ../..
      dockerfile: deploy/truenas/Dockerfile
    image: infra-analysis:local
    container_name: infra-analysis
    restart: unless-stopped
    # Run as the dataset's owner, not root. The dataset is acltype=nfsv4 with
    # aclmode=restricted; container root does not get the override a host root
    # shell does, and rsync could create directories there but not files
    # (EPERM). As the owning uid, ordinary POSIX permissions apply and it just
    # works. Override via .env if your dataset is owned by different ids.
    user: "${INFRA_UID:-3000}:${INFRA_GID:-0}"   # 3000 = kevin, the dataset owner
    environment:
      INFRA_DATA: /data
      HOME: /tmp                              # non-root needs a writable HOME for git/ssh
      INFRA_PI: infra@100.72.190.123          # Tailscale address of the Pi
      INFRA_PI_ARCHIVE: infrasound-monitor/archive/
      # Inside /data, not /root: the container runs as a non-root uid, and
      # /root is mode 700 so it cannot even traverse into a mount there.
      INFRA_PI_KEY: /data/.ssh/id_infra
      INFRA_SITE_KEY: /data/.ssh/id_site
      # Optional GitHub Pages mirror. Unset it to serve locally only.
      INFRA_SITE_REPO: git@github.com:kcriqui/infrasound-monitor-site.git
      INFRA_KNOWN_HOSTS: /data/.ssh/known_hosts
      INFRA_SCHEDULE: "06:15"
      INFRA_RUN_AT_START: "0"                 # 1 = also run once on container start
      TZ: America/Los_Angeles
    volumes:
      - /mnt/HDD-pool/Projects/Claude/Infrasound:/data

  web:
    # Unprivileged variant: it listens on 8080, so it can run as a non-root uid.
    # That matters because the site files are mode 770 owned by the dataset owner
    # and, on this acltype=nfsv4 dataset, even container root cannot read them --
    # stock nginx returned 403 for every file.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: infra-web
    restart: unless-stopped
    user: "${INFRA_UID:-3000}:${INFRA_GID:-0}"
    # Loopback only: host-level Tailscale Serve/Funnel proxies to it, so nothing
    # needs to be reachable on the LAN. See README section 6.
    ports:
      - "127.0.0.1:8081:8080"
    # With the tailscale sidecar below, comment out `ports` above and uncomment
    # this instead: web then shares the sidecar's network namespace, and Funnel
    # terminates TLS there. No host port is involved at all.
    # network_mode: service:tailscale
    volumes:
      - /mnt/HDD-pool/Projects/Claude/Infrasound/site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # --- optional: give this stack its own tailnet hostname ------------------
  # Serves at https://infra.<tailnet>.ts.net/ instead of :8443 on the NAS's own
  # name. Rationale and setup (auth key, ACL tag) are in README section 6.
  #
  # To enable: strip the leading "# " from every line between BEGIN and END,
  # then swap `ports` for `network_mode` on `web` above. Nothing else changes.
  #
  # BEGIN tailscale-sidecar
  # tailscale:
  #   image: tailscale/tailscale:v1.80.2
  #   container_name: infra-tailscale
  #   hostname: infra
  #   restart: unless-stopped
  #   environment:
  #     TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in deploy/truenas/.env}
  #     TS_EXTRA_ARGS: --advertise-tags=tag:infra
  #     TS_STATE_DIR: /var/lib/tailscale
  #     TS_SERVE_CONFIG: /config/serve.json
  #     TS_USERSPACE: "true"
  #   volumes:
  #     - /mnt/HDD-pool/Projects/Claude/Infrasound/tailscale:/var/lib/tailscale
  #     - ./tailscale-serve.json:/config/serve.json:ro
  # END tailscale-sidecar
