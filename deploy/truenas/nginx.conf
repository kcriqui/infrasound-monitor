server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # site/ is a clone of the Pages repo, so .git sits in the served root.
    # Without this, the whole repo (including its remote URL) is downloadable.
    location ~ /\. { deny all; return 404; }

    # waterfall_full.html is ~11 MB of Plotly JSON -- highly compressible text.
    # GitHub Pages did this for you; a bare nginx does not.
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
