# INFRA20 station configuration.
#
# Copy this file to  config.toml  and edit it for your station:
#     cp config.example.toml config.toml
#
# config.toml is git-ignored, so your settings are never committed or overwritten
# by "git pull". Anything you leave out falls back to a sensible default.

[station]
network  = "XX"        # FDSN network code. XX = reserved "test/temporary"; request a real
                       # temporary code (fdsn.org) before sharing data publicly.
station  = "INFRA"     # station code, <= 5 chars
location = "00"
channel  = "SDF"       # FDSN channel: S = short-period, D = pressure, F = infrasound
site_name = "My infrasound station"

# Sensor location, decimal degrees (West longitude and South latitude are NEGATIVE).
# Needed if you ever share the data so others can locate/compare your station.
latitude  = 0.0
longitude = 0.0
elevation = 0.0        # metres above sea level

# Sample rate of YOUR unit, samples/s. The recorder measures the real rate and stores it
# per segment, so this is only its starting estimate and the analysis rate (keep it
# fixed once a PSD grid exists, or the grid is recomputed). After a day of recording,
# `journalctl -u infra-acquire | tail` shows the measured rate in each "flushed" line.
sample_rate = 51.422

# Local time = UTC + this many hours (Pacific Standard = -8, Pacific Daylight = -7,
# US Eastern Standard = -5, UTC = 0). Used only for labels; a single value can't
# track daylight saving, so night-based analysis derives the quiet hours from data.
utc_offset_hours = -8

[acquisition]
port      = "/dev/ttyUSB0"  # serial port (or /dev/ttyS0); list with: infra-acquire --list
archive   = "archive"  # miniSEED archive directory (relative to the project, or absolute)
live_file = "live.npz" # rolling buffer for the live viewer (relative or absolute)

[weather]
# Airport weather stations for the wind-matched change monitor, most representative
# first: FAA ids as the Iowa Environmental Mesonet uses them (e.g. "SJC", not "KSJC");
# find yours at https://mesonet.agron.iastate.edu/sites/locate.php. The nightly rebuild
# fetches them (free, no key). Empty = no weather, no change monitor.
stations = []
# dir = "archive/weather"   # default: <archive>/weather, so archive backups include it

[analysis]
# When the source you're watching started (e.g. a datacenter energised), "YYYY-MM-DD"
# UTC. The change monitor then compares after against before. Until then it compares
# the last recent_days days with everything earlier.
# change_date = "2027-01-15"
recent_days = 14
