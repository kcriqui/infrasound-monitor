# TrueNAS SCALE Compose stack: analysis + a local web view of the dashboard.
# Run with the Compose CLI from the repo, not as a Custom App (README section 7).
#
# The Pi keeps only acquisition (infra-acquire, statusd, the TFT) -- all tiny.
# Everything that needs memory happens here. Deploy with the dataset path below
# matching the one you created; see README.md in this directory.

# Pin the project name. Without it Compose names the project after this file's
# directory -- "truenas" -- which says nothing about what runs here and is the
# kind of generic name another stack can collide with. Pinned, every
# `docker compose -f …` command (and `docker compose -p infrasound …` from
# anywhere) addresses this stack, and its network is infrasound_default.
name: infrasound

services:
  analysis:
    build:
      context: ../..
      dockerfile: deploy/truenas/Dockerfile
    image: infra-analysis:local
    container_name: infra-analysis
    restart: unless-stopped
    # Run as the dataset's owner, not root. The dataset is acltype=nfsv4 with
    # aclmode=restricted; container root does not get the override a host root
    # shell does, and rsync could create directories there but not files
    # (EPERM). As the owning uid, ordinary POSIX permissions apply and it just
    # works. Override via .env if your dataset is owned by different ids.
    user: "${INFRA_UID:-3000}:${INFRA_GID:-0}"   # 3000 = kevin, the dataset owner
    environment:
      INFRA_DATA: /data
      HOME: /tmp                              # non-root needs a writable HOME for ssh
      INFRA_PI: infra@100.72.190.123          # Tailscale address of the Pi
      INFRA_PI_ARCHIVE: infrasound-monitor/archive/
      # Inside /data, not /root: the container runs as a non-root uid, and
      # /root is mode 700 so it cannot even traverse into a mount there.
      INFRA_PI_KEY: /data/.ssh/id_infra
      # Pull-only (since 2026-10-29): the Pi rebuilds and serves the dashboard
      # itself, and this box is just the snapshotted off-Pi copy of the archive.
      # Set to "0" and start with `--profile serve` to rebuild and serve it here
      # instead -- after disabling the Pi's infra-dashboard.timer and its Funnel.
      INFRA_PULL_ONLY: "1"
      INFRA_KNOWN_HOSTS: /data/.ssh/known_hosts
      INFRA_SCHEDULE: "06:15"
      INFRA_RUN_AT_START: "0"                 # 1 = also run once on container start
      TZ: America/Los_Angeles
    volumes:
      - /mnt/HDD-pool/Projects/Claude/Infrasound:/data

  web:
    # Unprivileged variant: it listens on 8080, so it can run as a non-root uid.
    # That matters because the site files are mode 770 owned by the dataset owner
    # and, on this acltype=nfsv4 dataset, even container root cannot read them --
    # stock nginx returned 403 for every file.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: infra-web
    restart: unless-stopped
    # Off unless asked for: in pull-only mode site/ stops being rebuilt, and
    # serving a page that silently goes stale is worse than serving none.
    profiles: ["serve"]
    user: "${INFRA_UID:-3000}:${INFRA_GID:-0}"
    # Loopback only: put Tailscale Serve/Funnel in front of it to reach it, so
    # nothing needs to be reachable on the LAN.
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /mnt/HDD-pool/Projects/Claude/Infrasound/site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
